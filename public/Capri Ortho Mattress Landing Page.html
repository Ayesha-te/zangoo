document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 'Playfair Display';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"a68dca4f-99c9-4601-b6bd-40f11925afad\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"540f26cc-7488-4464-ba40-28fbf0e0d650\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"a6b92920-0fa8-4ace-97aa-c47c4f002ea9\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"deeb749f-8d3b-4e80-99ac-7e9c9b46462a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n\n:root{\n  --navy:#1A2E44;--cobalt:#2C5282;--blue:#1557A7;--blue-h:#0F4690;\n  --gold:#D6A85A;--gold-t:#7A5700;\n  --bg1:#F4F7FB;--bg2:#1A2E44;--bg3:#FFFFFF;\n  --bg4:#E8EFF7;--bg5:#2C5282;--bg6:#D0E2F0;\n  --bdr:#C8DAEA;\n  --on-dk:#E8EFF7;--on-dk2:#8BADC8;--muted:#4D667D;\n  --serif:'Playfair Display',Georgia,serif;\n  --sans:'DM Sans',system-ui,sans-serif;\n  --tr:.25s cubic-bezier(.4,0,.2,1);\n}\n*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\nhtml{scroll-snap-type:y mandatory;scroll-behavior:smooth;overflow-y:scroll;height:100%}\nbody{font-family:var(--sans);height:100%;-webkit-font-smoothing:antialiased;overflow-x:hidden}\n:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:3px}\n*:focus:not(:focus-visible){outline:none}\n.skip{position:absolute;top:-200%;left:16px;background:var(--blue);color:#fff;\n  padding:10px 24px;border-radius:0 0 8px 8px;font-size:14px;font-weight:600;z-index:9999;transition:top .2s}\n.skip:focus{top:0}\n.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;\n  clip:rect(0,0,0,0);white-space:nowrap;border:0}\n\n/* NAV */\n.nav{position:fixed;top:0;left:0;right:0;z-index:200;height:64px;\n  background:rgba(255,255,255,.97);backdrop-filter:blur(16px);\n  border-bottom:1px solid var(--bdr);transition:box-shadow var(--tr)}\n.nav.up{box-shadow:0 4px 16px rgba(26,46,68,.12)}\n.nav-in{max-width:1200px;margin:0 auto;padding:0 48px;height:100%;\n  display:flex;align-items:center;justify-content:space-between;gap:24px}\n.nav-logo{font-family:var(--serif);font-size:19px;font-weight:600;\n  color:var(--navy);letter-spacing:-.02em}\n.nav-sub{font-size:11px;font-weight:600;color:var(--muted);\n  letter-spacing:.06em;text-transform:uppercase}\n.nav-cta{font-size:14px;font-weight:600;color:#fff;background:var(--blue);\n  border:none;border-radius:7px;padding:10px 22px;min-height:44px;cursor:pointer;\n  transition:background var(--tr);text-decoration:none;display:flex;align-items:center}\n.nav-cta:hover{background:var(--blue-h)}\n\n/* DOTS */\n.dots{position:fixed;right:20px;top:50%;transform:translateY(-50%);\n  z-index:200;display:flex;flex-direction:column;gap:4px}\n.dot{width:44px;height:44px;border:none;background:transparent;cursor:pointer;\n  display:flex;align-items:center;justify-content:center;position:relative}\n.dot::after{content:'';width:9px;height:9px;border-radius:50%;\n  background:rgba(26,46,68,.28);border:2px solid rgba(255,255,255,.6);\n  transition:background var(--tr),transform var(--tr);display:block}\n.dot.act::after{background:var(--blue);border-color:var(--blue);transform:scale(1.4)}\n.dot-tip{position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);\n  white-space:nowrap;font-size:12px;font-weight:600;color:var(--navy);\n  background:rgba(255,255,255,.96);padding:4px 10px;border-radius:6px;\n  opacity:0;pointer-events:none;transition:opacity var(--tr);\n  box-shadow:0 2px 8px rgba(26,46,68,.12)}\n.dot:hover .dot-tip,.dot:focus-visible .dot-tip{opacity:1}\n\n/* PANEL BASE */\n.panel{scroll-snap-align:start;scroll-snap-stop:always;\n  height:100vh;width:100%;position:relative;overflow:hidden;display:flex}\n\n/* HERO */\n.panel-hero{background:var(--bg2)}\n.hero-split{position:relative;width:100%;height:calc(100% - 64px);margin-top:64px;overflow:hidden}\n.hero-img{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;\n  background:radial-gradient(ellipse at 55% 50%,#243552 0%,#1A2E44 100%);\n  overflow:hidden}\n.hero-img::before{content:'';position:absolute;inset:0;\n  background:linear-gradient(to right,rgba(10,18,30,.92) 0%,rgba(10,18,30,.82) 40%,rgba(10,18,30,.35) 58%,rgba(10,18,30,0) 72%);\n  z-index:1}\n.hero-img img{width:100%;height:100%;object-fit:cover;object-position:center;\n  position:relative;z-index:0;filter:none;animation:imgIn .9s .2s ease both}\n@keyframes imgIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}\n.hero-content{position:absolute;left:0;top:0;bottom:0;width:55%;max-width:640px;\n  display:flex;flex-direction:column;justify-content:center;\n  padding:0 64px 0 72px;z-index:2;overflow:hidden}\n.hero-eye{display:inline-flex;align-items:center;gap:10px;font-size:11px;\n  font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);\n  margin-bottom:18px;animation:up .6s .05s both}\n.hero-eye::before{content:'';width:28px;height:2px;background:var(--gold);border-radius:2px}\n.hero-h1{font-family:var(--serif);font-size:clamp(40px,5.2vw,74px);font-weight:400;\n  line-height:1.07;letter-spacing:-.02em;color:#fff;margin-bottom:12px;\n  animation:up .7s .12s both}\n.hero-h1 em{font-style:italic;color:var(--gold)}\n.hero-sub{font-size:clamp(15px,1.5vw,18px);color:#D3E1EE;line-height:1.65;\n  margin-bottom:28px;max-width:380px;animation:up .7s .2s both}\n.hero-price{font-size:clamp(16px,1.6vw,19px);color:#fff;margin-bottom:22px;\n  animation:up .65s .32s both}\n.hero-price strong{font-family:var(--serif);font-weight:400;font-size:1.35em;color:var(--gold)}\n.hero-price span{color:#D3E1EE;font-size:.8em}\n.hero-img-badges{position:absolute;top:24px;right:96px;z-index:3;\n  display:flex;flex-direction:column;gap:8px;align-items:flex-end}\n.hero-img-badge{font-size:12px;font-weight:700;letter-spacing:.04em;color:#fff;white-space:nowrap;\n  background:rgba(10,20,35,.6);border:1px solid rgba(255,255,255,.35);\n  backdrop-filter:blur(6px);padding:7px 14px;border-radius:100px}\n.hero-img-badge.alt{background:rgba(214,168,90,.85);border-color:rgba(214,168,90,.9);color:#1A2E44}\n.hero-specs{display:flex;gap:28px;margin-bottom:32px;animation:up .65s .28s both}\n.sv{font-family:var(--serif);font-size:26px;font-weight:400;color:var(--gold);display:block}\n.sl{font-size:11px;font-weight:600;color:#C7D9E8;letter-spacing:.04em;display:block}\n.hero-btns{display:flex;gap:12px;flex-wrap:wrap;animation:up .65s .35s both}\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;\n  min-height:48px;padding:12px 28px;font-family:var(--sans);font-size:16px;\n  font-weight:600;border:2px solid transparent;border-radius:8px;cursor:pointer;\n  text-decoration:none;white-space:nowrap;\n  transition:background var(--tr),color var(--tr),border-color var(--tr),\n    transform var(--tr),box-shadow var(--tr)}\n.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)}\n.btn-p:hover{background:var(--blue-h);border-color:var(--blue-h);\n  transform:translateY(-2px);box-shadow:0 6px 20px rgba(21,87,167,.35)}\n.btn-lt{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}\n.btn-lt:hover{background:rgba(255,255,255,.1);border-color:#fff}\n.btn-dk{background:var(--navy);color:#fff;border-color:var(--navy)}\n.btn-dk:hover{background:#0F2033;transform:translateY(-2px)}\n.btn-wh{background:#fff;color:var(--navy);border-color:#fff}\n.btn-wh:hover{background:var(--bg1);transform:translateY(-2px)}\n.scroll-cue{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);\n  display:flex;flex-direction:column;align-items:center;gap:6px;z-index:10;\n  animation:bob 2.5s 2s ease-in-out infinite}\n.scroll-cue span{font-size:10px;font-weight:700;letter-spacing:.12em;\n  text-transform:uppercase;color:#fff;\n  background:var(--blue);padding:3px 10px;border-radius:100px}\n.scroll-cue svg{width:34px;height:34px;stroke:#fff;fill:none;\n  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;\n  background:var(--blue);border-radius:50%;padding:8px;box-shadow:0 4px 14px rgba(21,87,167,.4)}\n@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}\n  50%{transform:translateX(-50%) translateY(7px)}}\n@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}\n\n/* FEATURE PANELS */\n.feat{display:grid;grid-template-columns:50% 50%;grid-template-rows:minmax(0,1fr);width:100%;height:calc(100% - 64px);margin-top:64px}\n.feat.flip{grid-template-columns:50% 50%}\n.feat-vis{display:flex;align-items:center;justify-content:center;\n  position:relative;overflow:hidden;min-height:0;padding:28px 32px}\n.feat-vis svg{width:100%;height:100%;display:block;max-height:100%;object-fit:contain}\n.feat-content{display:flex;flex-direction:column;justify-content:center;\n  padding:48px clamp(32px,4.5vw,72px);overflow-y:auto;min-height:0}\n/* Section number badge on diagram side */\n.feat-num-badge{position:absolute;top:24px;left:24px;\n  font-family:var(--serif);font-size:13px;font-weight:700;\n  letter-spacing:.12em;padding:6px 14px;border-radius:100px font-size:16px;color:#3D5170;max-width:540px;margin:0 auto}\n.rev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex-shrink:0}\n.rc{background:var(--bg1);border:1px solid var(--bdr);border-radius:14px;padding:24px}\n.rc-stars{color:#D6A85A;font-size:15px;letter-spacing:2px;margin-bottom:10px;display:block}\n.rc-quote{font-size:14px;color:#3D5170;line-height:1.65;margin-bottom:18px;font-style:italic}\n.rc-author{display:flex;align-items:center;gap:12px;\n  padding-top:14px;border-top:1px solid var(--bdr)}\n.rc-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;\n  justify-content:center;font-size:14px;font-weight:700;color:#fff;\n  background:linear-gradient(135deg,var(--blue),var(--cobalt));flex-shrink:0}\n.rc-name{font-size:13px;font-weight:700;color:var(--navy);display:block}\n.rc-vfy{font-size:12px;color:#2E7D32;display:block}\n.rc-cond{font-size:11px;color:var(--muted);display:block;margin-top:1px}\n\n/* PANEL REVEAL */\n.pan-anim .feat-content{opacity:0;transform:translateY(20px);\n  transition:opacity .7s ease,transform .7s ease}\n.pan-anim .feat-vis{opacity:0;transform:scale(.97);\n  transition:opacity .7s .1s ease,transform .7s .1s ease}\n.pan-anim .cta-inner,.pan-anim .faq-inner,.pan-anim .rev-inner{\n  opacity:0;transform:translateY(20px);\n  transition:opacity .7s ease,transform .7s ease}\n.pan-anim.vis .feat-content,.pan-anim.vis .cta-inner,\n.pan-anim.vis .faq-inner,.pan-anim.vis .rev-inner{opacity:1;transform:none}\n.pan-anim.vis .feat-vis{opacity:1;transform:none}\n\n/* RESPONSIVE */\n@media(max-width:1024px){\n  .feat{grid-template-columns:50% 50%}\n  .feat.flip{grid-template-columns:50% 50%}\n}\n@media(max-width:900px){\n  .nav-in{padding:0 20px}\n  .dots{right:6px}\n  .hero-split{grid-template-columns:1fr;grid-template-rows:auto 1fr}\n  .hero-img{min-height:100%}\n  .hero-content{padding:20px 24px}\n  .feat,.feat.flip{grid-template-columns:1fr;margin-top:64px}\n  .feat-vis{min-height:280px;order:-1}\n  .fea i-q\">What mattress sizes are available?<\u002Fspan>\n          <span class=\"fi-icon\" aria-hidden=\"true\">+<\u002Fspan>\n        <\u002Fbutton>\n        <div class=\"fi-body\" id=\"fa2\" aria-hidden=\"true\">\n          <p class=\"fi-a\">The Capri Ortho is available in Single (90x190cm), Small Double (120x190cm), Double (135x190cm), King (150x200cm), and Super King (180x200cm).<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fi\">\n        <button class=\"fi-btn\" aria-expanded=\"false\" aria-controls=\"fa3\" type=\"button\">\n          <span class=\"fi-q\">Is it compatible with my existing bed frame?<\u002Fspan>\n          <span class=\"fi-icon\" aria-hidden=\"true\">+<\u002Fspan>\n        <\u002Fbutton>\n        <div class=\"fi-body\" id=\"fa3\" aria-hidden=\"true\">\n          <p class=\"fi-a\">Yes. The Capri Ortho works with all slatted bases, divan beds, and solid platform beds. For slatted bases, we recommend slat spacing no greater than 7cm for optimal spring support.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fi\">\n        <button class=\"fi-btn\" aria-expanded=\"false\" aria-controls=\"fa4\" type=\"button\">\n          <span class=\"fi-q\">How long will delivery take?<\u002Fspan>\n          <span class=\"fi-icon\" aria-hidden=\"true\">+<\u002Fspan>\n        <\u002Fbutton>\n        <div class=\"fi-body\" id=\"fa4\" aria-hidden=\"true\">\n          <p class=\"fi-a\">We offer free standard delivery within 3-5 working days. White-glove delivery with room-of-choice placement and old mattress removal is also available. All mattresses are delivered rolled for easy handling.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fi\">\n        <button class=\"fi-btn\" aria-expanded=\"false\" aria-controls=\"fa5\" type=\"button\">\n          <span class=\"fi-q\">What is the mattress made from?<\u002Fspan>\n          <span class=\"fi-icon\" aria-hidden=\"true\">+<\u002Fspan>\n        <\u002Fbutton>\n        <div class=\"fi-body\" id=\"fa5\" aria-hidden=\"true\">\n          <p class=\"fi-a\">The Capri Ortho features quality damask fabric, a deep polyester comfort filling, an orthopaedic open coil spring unit with wire edge support, and traditional hand-placed deep tufts — all assembled by skilled craftspeople in the UK.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fi\">\n        <button class=\"fi-btn\" aria-expanded=\"false\" aria-controls=\"fa6\" type=\"button\">\n          <span class=\"fi-q\">Is the Capri Ortho suitable for all sleeping positions?<\u002Fspan>\n          <span class=\"fi-icon\" aria-hidden=\"true\">+<\u002Fspan>\n        <\u002Fbutton>\n        <div class=\"fi-body\" id=\"fa6\" aria-hidden=\"true\">\n          <p class=\"fi-a\">Yes. The medium-firm orthopaedic support is suitable for back, side, and combination sleepers. The deep polyester filling provides surface cushioning while the firm spring unit maintains correct spinal alignment in all positions.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fi\">\n        <button class=\"fi-btn\" aria-expanded=\"false\" aria-controls=\"fa7\" type=\"button\">\n          <span class=\"fi-q\">How long should a mattress last?<\u002Fspan>\n          <span class=\"fi-icon\" aria-hidden=\"true\">+<\u002Fspan>\n        <\u002Fbutton>\n        <div class=\"fi-body\" id=\"fa7\" aria-hidden=\"true\">\n          <p class=\"fi-a\">With proper care — regular flipping and rotating — the Capri Ortho is designed to provide excellent support for 8-10 years. Its double-sided construction means both surfaces receive equal use, effectively doubling the usable life compared to a single-sided mattress.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- ═══ PANEL 10 — ORDER (bg2 navy) ═══ -->\n<section class=\"order-panel th-order pan-anim\" id=\"s11\" aria-labelledby=\"s11-h\">\n  <div class=\"order-inner\">\n    <span class=\"order-lbl\">Order Your Capri Ortho<\u002Fspan>\n    <h2 class=\"order-h\" id=\"s11-h\">Choose Your <em>Size<\u002Fem><\u002Fh2>\n    <p class=\"order-sub\">Free delivery on all sizes. 30-day returns. Every mattress hand-built in the UK.<\u002Fp>\n\n    <!-- Size selector -->\n    <div class=\"size-grid\" role=\"group\" aria-labelledby=\"size-label\">\n      <span id=\"size-label\" class=\"sr\">Choose mattress size<\u002Fspan>\n\n      <label class=\"size-card selected\" id=\"card-single\" for=\"sz-single\" onclick=\"selectSize(this,'sz-single')\">\n        <input type=\"radio\" name=\"size\" id=\"sz-single\" value=\"single\" checked=\"\">\n        <span class=\"size-name\">Single<\u002Fspan>\n        <span class=\"size-dim\">90 × 190cm<\u002Fspan>\n        <span class=\"size-price\">£299<\u002Fspan>\n        <span class=\"size-old\">£349<\u002Fspan>\n      <\u002Flabel>\n\n      <label class=\"size-card\" id=\"card-double\" for=\"sz-double\" onclick=\"selectSize(this,'sz-double')\">\n        <input type=\"radio\" name=\"size\" id=\"sz-double\" value=\"double\">\n        <span class=\"size-name\">Double<\u002Fspan>\n        <span class=\"size-dim\">135 × 190cm<\u002Fspan>\n        <span class=\"size-price\">£379<\u002Fspan>\n        <span class=\"size-old\">£449<\u002Fspan>\n      <\u002Flabel>\n\n      <label class=\"size-card\" id=\"card-king\" for=\"sz-king\" onclick=\"selectSize(this,'sz-king')\">\n        <input type=\"radio\" name=\"size\" id=\"sz-king\" value=\"king\">\n        <span class=\"size-name\">King<\u002Fspan>\n        <span class=\"size-dim\">150 × 200cm<\u002Fspan>\n        <span class=\"size-price\">£449<\u002Fspan>\n        <span class=\"size-old\">£529<\u002Fspan>\n      <\u002Flabel>\n    <\u002Fdiv>\n\n    <!-- Base add-on -->\n    <label class=\"addon-box\" id=\"addon-base\" for=\"add-base\" onclick=\"toggleBase()\">\n      <input type=\"checkbox\" id=\"add-base\">\n      <div class=\"addon-info\">\n        <span class=\"addon-name\">Add a Matching Divan Base<\u002Fspan>\n        <span class=\"addon-desc\">Solid platform base in matching fabric — same size as your mattress. Free delivery with mattress.<\u002Fspan>\n      <\u002Fdiv>\n      <span class=\"addon-price\" id=\"base-price\">+ £199<\u002Fspan>\n    <\u002Flabel>\n\n    <!-- Summary -->\n    <div class=\"order-summary\" aria-live=\"polite\" aria-atomic=\"true\">\n      <div>\n        <span class=\"summary-label\">Your order:<\u002Fspan>\n        <span class=\"summary-label\" id=\"summary-text\" style=\"color:#fff;font-weight:600;margin-left:8px\">Capri Ortho Single<\u002Fspan>\n      <\u002Fdiv>\n      <span class=\"summary-total\">£<span id=\"total-price\">299<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n\n    <!-- CTAs -->\n    <div class=\"order-actions\">\n      <button class=\"btn btn-gold\" style=\"font-size:17px;padding:14px 44px\" onclick=\"handleOrder()\" aria-label=\"Add to basket and proceed to checkout\">\n        Add to Basket\n      <\u002Fbutton>\n      <a href=\"tel:+441234567890\" class=\"btn btn-lt\">\n        📞 Call to Order\n      <\u002Fa>\n    <\u002Fdiv>\n\n    <!-- Trust pills -->\n    <div class=\"order-trust\" aria-label=\"Purchase assurances\">\n      <span class=\"trust-pill\">Free UK Delivery<\u002Fspan>\n      <span class=\"trust-pill\">30-Day Returns<\u002Fspan>\n      <span class=\"trust-pill\">Handmade in Britain<\u002Fspan>\n      <span class=\"trust-pill\">Secure Checkout<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer role=\"contentinfo\">\n  <div class=\"foot-in\">\n    <a href=\"/\" class=\"foot-logo\" aria-label=\"Furniture Co. home\">Furniture Co.<\u002Fa>\n    <nav aria-label=\"Footer navigation\">\n      <ul class=\"foot-links\" role=\"list\">\n        <li><a href=\"#\">Mattresses<\u002Fa><\u002Fli>\n        <li><a href=\"#\">Beds &amp; Bases<\u002Fa><\u002Fli>\n        <li><a href=\"#\">Delivery Info<\u002Fa><\u002Fli>\n        <li><a href=\"#\">Returns Policy<\u002Fa><\u002Fli>\n        <li><a href=\"#\">Privacy Policy<\u002Fa><\u002Fli>\n        <li><a href=\"#\">Accessibility<\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fnav>\n    <p class=\"foot-copy\"><small>© 2026 Furniture Co. All rights reserved.<\u002Fsmall><\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n\n<script>\n\n(function () {\n  // Nav shadow\n  var nav = document.getElementById('nav');\n  window.addEventListener('scroll', function () {\n    nav.classList.toggle('up', window.scrollY > 10);\n  }, { passive: true });\n\n  // Panel reveal\n  var panels = Array.prototype.slice.call(document.querySelectorAll('.pan-anim'));\n  if ('IntersectionObserver' in window) {\n    var revObs = new IntersectionObserver(function (entries) {\n      entries.forEach(function (e) {\n        if (e.intersectionRatio >= 0.45) e.target.classList.add('vis');\n      });\n    }, { threshold: 0.45 });\n    panels.forEach(function (p) { revObs.observe(p); });\n  } else {\n    panels.forEach(function (p) { p.classList.add('vis'); });\n  }\n\n  // Dot navigation\n  var sectionIds = ['s0','s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11'];\n  var dots = Array.prototype.slice.call(document.querySelectorAll('.dot'));\n\n  function setDot(id) {\n    dots.forEach(function (d) {\n      d.classList.toggle('act', d.dataset.target === id);\n    });\n  }\n\n  dots.forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      var el = document.getElementById(btn.dataset.target);\n      if (el) el.scrollIntoView({ behavior: 'smooth' });\n    });\n  });\n\n  var sectEls = sectionIds.map(function (id) { return document.getElementById(id); });\n  if ('IntersectionObserver' in window) {\n    var dotObs = new IntersectionObserver(function (entries) {\n      entries.forEach(function (e) {\n        if (e.isIntersecting && e.intersectionRatio >= 0.5) setDot(e.target.id);\n      });\n    }, { threshold: 0.5 });\n    sectEls.forEach(function (el) { if (el) dotObs.observe(el); });\n  }\n\n  // Arrow / Page key navigation\n  document.addEventListener('keydown', function (e) {\n    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' &&\n        e.key !== 'PageDown'  && e.key !== 'PageUp') return;\n    e.preventDefault();\n    var curr = -1;\n    sectEls.forEach(function (el, i) {\n      if (!el) return;\n      var r = el.getBoundingClientRect();\n      if (r.top >= -10 && r.top < window.innerHeight * 0.5) curr = i;\n    });\n    var next = (e.key === 'ArrowDown' || e.key === 'PageDown')\n      ? Math.min(curr + 1, sectEls.length - 1)\n      : Math.max(curr - 1, 0);\n    var target = sectEls[next];\n    if (target) target.scrollIntoView({ behavior: 'smooth' });\n  });\n\n\n  // Order panel interactivity\n  var prices = { single: 299, double: 379, king: 449 };\n  var basePrices = { single: 199, double: 249, king: 299 };\n  var currentSize = 'single';\n  var baseAdded = false;\n\n  function selectSize(card, inputId) {\n    // Update selected card styling\n    document.querySelectorAll('.size-card').forEach(function(c) {\n      c.classList.remove('selected');\n    });\n    card.classList.add('selected');\n    document.getElementById(inputId).checked = true;\n    currentSize = document.getElementById(inputId).value;\n    // Update base price\n    document.getElementById('base-price').textContent = '+ \\u00A3' + basePrices[currentSize];\n    updateSummary();\n  }\n\n  function toggleBase() {\n    // Allow checkbox toggle on next tick (after label click processes)\n    setTimeout(function() {\n      baseAdded = document.getElementById('add-base').checked;\n      var box = document.getElementById('addon-base');\n      baseAdded ? box.classList.add('selected') : box.classList.remove('selected');\n      updateSummary();\n    }, 10);\n  }\n\n  function updateSummary() {\n    var total = prices[currentSize] + (baseAdded ? basePrices[currentSize] : 0);\n    var sizeLabel = currentSize.charAt(0).toUpperCase() + currentSize.slice(1);\n    var baseLabel = baseAdded ? ' + Divan Base' : '';\n    document.getElementById('summary-text').textContent = 'Capri Ortho ' + sizeLabel + baseLabel;\n    document.getElementById('total-price').textContent = total;\n  }\n\n  function handleOrder() {\n    var sizeLabel = currentSize.charAt(0).toUpperCase() + currentSize.slice(1);\n    var baseLabel = baseAdded ? ' with Divan Base' : '';\n    alert('Adding to basket: Capri Ortho ' + sizeLabel + baseLabel +\n          ' \\u2014 \\u00A3' + (prices[currentSize] + (baseAdded ? basePrices[currentSize] : 0)) +\n          '\\n\\nIn a real store this would proceed to checkout.');\n  }\n\n  // FAQ accordion\n  document.querySelectorAll('.fi-btn').forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      var expanded = btn.getAttribute('aria-expanded') === 'true';\n      // close all\n      document.querySelectorAll('.fi-btn').forEach(function (b) {\n        b.setAttribute('aria-expanded', 'false');\n      });\n      document.querySelectorAll('.fi-body').forEach(function (b) {\n        b.setAttribute('aria-hidden', 'true');\n      });\n      if (!expanded) {\n        btn.setAttribute('aria-expanded', 'true');\n        var bodyId = btn.getAttribute('aria-controls');\n        document.getElementById(bodyId).setAttribute('aria-hidden', 'false');\n      }\n    });\n  });\n}());\n\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
